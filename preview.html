<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Korea Passport – Preview</title>
  <style>
/* ── Viewport wrapper ── */
body { margin: 0; background: #0a0a14; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; padding: 32px 0; font-family: sans-serif; }
.phone-shell {
  width: 390px; height: 844px; border-radius: 54px; overflow: hidden;
  box-shadow: 0 0 0 2px #2a2a3a, 0 0 0 8px #111, 0 40px 80px rgba(0,0,0,.8);
  position: relative; flex-shrink: 0;
}
.phone-shell iframe { width: 100%; height: 100%; border: none; border-radius: 54px; }
.label {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  color: #64748b; font-size: 13px; letter-spacing: .05em;
}

/* ── App CSS ── */
/* Reset & Base */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0f172a;
  --surface: #1e293b;
  --surface2: #111827;
  --border: rgba(255,255,255,.1);
  --accent: #3b82f6;
  --accent-dark: #1d4ed8;
  --gold: #f59e0b;
  --text: #f1f5f9;
  --muted: #94a3b8;
  --radius: 20px;
  --nav-h: 76px;
}

html, body { height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }

#app { height: 100%; display: flex; flex-direction: column; max-width: 480px; margin: 0 auto; position: relative; }

/* Safe area for notch */
.safe-top { height: env(safe-area-inset-top, 20px); min-height: 20px; }

/* Tab content */
.tab-content { display: none; flex: 1; overflow: hidden; flex-direction: column; }
.tab-content.active { display: flex; }

.scroll-area { flex: 1; overflow-y: auto; padding: 16px 18px calc(var(--nav-h) + 16px); -webkit-overflow-scrolling: touch; }

/* Passport card */
.passport-card {
  background: linear-gradient(145deg, #1e3a5f, #111827);
  border: 1px solid rgba(59,130,246,.3);
  border-radius: 28px;
  padding: 28px 24px;
  margin-bottom: 18px;
  box-shadow: 0 20px 60px rgba(0,0,0,.4);
}
.eyebrow { font-size: 12px; letter-spacing: .2em; color: #93c5fd; margin-bottom: 14px; }
h1 { font-size: 36px; font-weight: 800; line-height: 1.1; margin-bottom: 10px; }
.sub { color: var(--muted); font-size: 15px; line-height: 1.5; }

/* Progress box */
.progress-box {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px;
  margin-bottom: 14px;
}
.progress-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.label { color: var(--muted); font-size: 14px; }
.bar { height: 10px; background: #334155; border-radius: 100px; overflow: hidden; }
.bar div { height: 100%; background: linear-gradient(90deg, #3b82f6, #60a5fa); border-radius: 100px; transition: width .4s ease; width: 0; }

/* City progress */
.city-progress { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
.city-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 14px; }
.city-card h3 { font-size: 14px; font-weight: 700; margin-bottom: 6px; }
.city-card .city-bar { height: 6px; background: #334155; border-radius: 100px; overflow: hidden; }
.city-card .city-bar div { height: 100%; background: var(--accent); border-radius: 100px; transition: width .4s; }
.city-pct { font-size: 12px; color: var(--muted); margin-top: 4px; }

/* Action row */
.action-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 10px; }
.btn-primary { background: var(--accent); color: #fff; border: none; border-radius: 16px; padding: 16px 12px; font-size: 15px; font-weight: 700; cursor: pointer; -webkit-tap-highlight-color: transparent; transition: opacity .15s; }
.btn-primary:active { opacity: .75; }
.btn-secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: 16px; padding: 16px 12px; font-size: 15px; font-weight: 600; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.btn-secondary:active { opacity: .75; }
.gps-note { font-size: 12px; color: var(--muted); line-height: 1.4; text-align: center; padding: 0 8px; }

/* Badges tab */
.section-title { font-size: 22px; font-weight: 800; margin-bottom: 16px; }

.filter-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
.filter-chip { background: var(--surface); border: 1px solid var(--border); color: var(--muted); border-radius: 100px; padding: 6px 14px; font-size: 13px; font-weight: 600; cursor: pointer; -webkit-tap-highlight-color: transparent; transition: all .15s; }
.filter-chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }

.badge-grid { display: grid; gap: 10px; }
.badge-item {
  display: flex; align-items: center; gap: 14px;
  background: var(--surface2); border: 1px solid var(--border); border-radius: 18px;
  padding: 14px; cursor: pointer; -webkit-tap-highlight-color: transparent; transition: border-color .15s;
}
.badge-item:active { opacity: .8; }
.badge-item.earned { border-color: rgba(245,158,11,.4); background: rgba(245,158,11,.05); }
.badge-icon { width: 50px; height: 50px; border-radius: 50%; background: #334155; display: flex; align-items: center; justify-content: center; font-size: 26px; flex-shrink: 0; }
.badge-item.earned .badge-icon { background: rgba(245,158,11,.2); }
.badge-info h3 { font-size: 15px; font-weight: 700; margin-bottom: 3px; }
.badge-info p { font-size: 13px; color: var(--muted); }
.badge-info .badge-tag { display: inline-block; background: var(--surface); border: 1px solid var(--border); border-radius: 100px; font-size: 11px; padding: 2px 8px; margin-top: 4px; color: var(--muted); }
.badge-check { margin-left: auto; font-size: 20px; flex-shrink: 0; }

/* Stats tab */
#statsPanel { display: grid; gap: 14px; }
.stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; }
.stat-card h3 { font-size: 13px; color: var(--muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: .1em; }
.stat-number { font-size: 42px; font-weight: 800; color: var(--accent); line-height: 1; }
.stat-sub { font-size: 14px; color: var(--muted); margin-top: 4px; }
.category-list { display: grid; gap: 8px; }
.category-row { display: flex; justify-content: space-between; align-items: center; }
.category-row span:first-child { font-size: 14px; }
.category-row span:last-child { font-size: 14px; font-weight: 700; color: var(--accent); }

/* Bottom Nav */
#bottomNav {
  position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
  width: min(480px, 100%);
  display: grid; grid-template-columns: repeat(3, 1fr);
  background: rgba(15,23,42,.92); backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  border-top: 1px solid var(--border);
  padding-bottom: env(safe-area-inset-bottom, 0);
  z-index: 100;
}
.nav-btn { background: transparent; border: none; color: var(--muted); padding: 10px 6px; display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; -webkit-tap-highlight-color: transparent; transition: color .15s; }
.nav-btn span:first-child { font-size: 22px; }
.nav-btn span:last-child { font-size: 11px; font-weight: 600; }
.nav-btn.active { color: var(--accent); }

/* Toast */
.toast {
  position: fixed; top: max(env(safe-area-inset-top, 20px), 20px); left: 50%;
  transform: translateX(-50%); width: min(360px, calc(100% - 40px));
  background: rgba(30,41,59,.96); backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid rgba(245,158,11,.4); border-radius: 18px;
  padding: 16px 20px; display: flex; align-items: center; gap: 14px;
  box-shadow: 0 12px 40px rgba(0,0,0,.5); z-index: 200;
  transition: opacity .3s, transform .3s;
}
.toast.hidden { opacity: 0; pointer-events: none; transform: translateX(-50%) translateY(-12px); }
.toast span:first-child { font-size: 36px; flex-shrink: 0; }
.toast strong { font-size: 15px; display: block; color: #fde68a; }
.toast p { font-size: 13px; color: var(--muted); margin-top: 2px; }

  </style>
</head>
<body>

<div class="phone-shell">
  <div id="app" style="height:100%;overflow:hidden;">

    <div id="tab-passport" class="tab-content active">
      <div class="safe-top"></div>
      <div class="scroll-area">
        <div class="passport-card">
          <p class="eyebrow">🇰🇷 KOREA PASSPORT</p>
          <h1>Collect Real Korea</h1>
          <p class="sub">Visit places, unlock badges, share your journey.</p>
        </div>
        <div class="progress-box">
          <div class="progress-row">
            <span class="label">Overall Progress</span>
            <strong id="overallText">0 / 12</strong>
          </div>
          <div class="bar"><div id="overallBar"></div></div>
        </div>
        <div class="city-progress" id="cityProgress"></div>
        <div class="action-row">
          <button id="gpsBtn" class="btn-primary">📍 Check Location</button>
          <button id="shareBtn" class="btn-secondary">📤 Share</button>
        </div>
        <p class="gps-note">GPS works only on HTTPS. Tap any badge to collect in demo mode.</p>
      </div>
    </div>

    <div id="tab-badges" class="tab-content">
      <div class="safe-top"></div>
      <div class="scroll-area">
        <h2 class="section-title">All Badges</h2>
        <div class="filter-row" id="filterRow"></div>
        <div id="badgeGrid" class="badge-grid"></div>
      </div>
    </div>

    <div id="tab-stats" class="tab-content">
      <div class="safe-top"></div>
      <div class="scroll-area">
        <h2 class="section-title">My Stats</h2>
        <div id="statsPanel"></div>
      </div>
    </div>

    <nav id="bottomNav">
      <button data-tab="passport" class="nav-btn active"><span>🗺️</span><span>Passport</span></button>
      <button data-tab="badges"   class="nav-btn"><span>🏅</span><span>Badges</span></button>
      <button data-tab="stats"    class="nav-btn"><span>📊</span><span>Stats</span></button>
    </nav>

    <div id="toast" class="toast hidden">
      <span id="toastEmoji"></span>
      <div><strong id="toastTitle"></strong><p id="toastSub"></p></div>
    </div>

  </div>
</div>

<p class="label">Korea Passport PWA – iPhone 15 Pro preview (390×844)</p>

<script>
'use strict';

const BADGES = [
  // Seoul
  { id:'nseoul',    name:'N Seoul Tower',       city:'Seoul',    cat:'Landmark', emoji:'🗼', lat:37.5512, lng:126.9882 },
  { id:'gyeongbok', name:'Gyeongbokgung',        city:'Seoul',    cat:'Culture',  emoji:'🏯', lat:37.5796, lng:126.9770 },
  { id:'gwangjang', name:'Gwangjang Market',     city:'Seoul',    cat:'Food',     emoji:'🍜', lat:37.5700, lng:126.9996 },
  { id:'hongdae',   name:'Hongdae Street',       city:'Seoul',    cat:'Vibe',     emoji:'🎧', lat:37.5572, lng:126.9254 },
  { id:'bukchon',   name:'Bukchon Hanok',        city:'Seoul',    cat:'Culture',  emoji:'🏘️', lat:37.5826, lng:126.9830 },
  // Busan
  { id:'haeundae',  name:'Haeundae Beach',       city:'Busan',    cat:'Nature',   emoji:'🌊', lat:35.1587, lng:129.1604 },
  { id:'gamcheon',  name:'Gamcheon Village',     city:'Busan',    cat:'Culture',  emoji:'🎨', lat:35.0975, lng:129.0106 },
  { id:'jagalchi',  name:'Jagalchi Market',      city:'Busan',    cat:'Food',     emoji:'🐟', lat:35.0969, lng:129.0305 },
  // Jeonju / Gyeongju / Jeju / Suwon
  { id:'jeonju',    name:'Jeonju Hanok Village', city:'Jeonju',   cat:'Culture',  emoji:'🍚', lat:35.8151, lng:127.1534 },
  { id:'bulguksa',  name:'Bulguksa Temple',      city:'Gyeongju', cat:'Culture',  emoji:'⛩️', lat:35.7900, lng:129.3320 },
  { id:'ilchul',    name:'Seongsan Ilchulbong',  city:'Jeju',     cat:'Nature',   emoji:'🌋', lat:33.4581, lng:126.9425 },
  { id:'hwaseong',  name:'Suwon Hwaseong',       city:'Suwon',    cat:'Landmark', emoji:'🏰', lat:37.2871, lng:127.0116 },
];

const CITIES = [...new Set(BADGES.map(b => b.city))];
const CATS   = [...new Set(BADGES.map(b => b.cat))];

// --- State ---
const earned = new Set(JSON.parse(localStorage.getItem('kp_earned') || '[]'));
let activeFilter = 'All';

function save() { localStorage.setItem('kp_earned', JSON.stringify([...earned])); }

function collect(id) {
  if (earned.has(id)) return;
  earned.add(id);
  save();
  const b = BADGES.find(x => x.id === id);
  showToast(b.emoji, b.name, `${b.city} · ${b.cat} badge collected!`);
  renderAll();
}

// --- Toast ---
let toastTimer;
function showToast(emoji, title, sub) {
  const el = document.getElementById('toast');
  document.getElementById('toastEmoji').textContent = emoji;
  document.getElementById('toastTitle').textContent = title;
  document.getElementById('toastSub').textContent = sub;
  el.classList.remove('hidden');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.add('hidden'), 3000);
}

// --- Haversine distance (km) ---
function distKm(lat1, lng1, lat2, lng2) {
  const R = 6371, r = Math.PI / 180;
  const dLat = (lat2 - lat1) * r, dLng = (lng2 - lng1) * r;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*r)*Math.cos(lat2*r)*Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

// --- Render ---
function renderAll() {
  renderPassport();
  renderBadges();
  renderStats();
}

function renderPassport() {
  const total = BADGES.length;
  const count = earned.size;
  document.getElementById('overallText').textContent = `${count} / ${total}`;
  document.getElementById('overallBar').style.width = `${count / total * 100}%`;

  const cityProgress = document.getElementById('cityProgress');
  cityProgress.innerHTML = '';
  CITIES.forEach(city => {
    const all = BADGES.filter(b => b.city === city);
    const done = all.filter(b => earned.has(b.id)).length;
    const pct = Math.round(done / all.length * 100);
    const card = document.createElement('div');
    card.className = 'city-card';
    card.innerHTML = `<h3>${city}</h3><div class="city-bar"><div style="width:${pct}%"></div></div><p class="city-pct">${done}/${all.length} · ${pct}%</p>`;
    cityProgress.appendChild(card);
  });
}

function renderBadges() {
  const grid = document.getElementById('badgeGrid');
  grid.innerHTML = '';
  const visible = activeFilter === 'All' ? BADGES : BADGES.filter(b => b.city === activeFilter || b.cat === activeFilter);
  visible.forEach(b => {
    const div = document.createElement('div');
    div.className = 'badge-item' + (earned.has(b.id) ? ' earned' : '');
    div.innerHTML = `
      <div class="badge-icon">${b.emoji}</div>
      <div class="badge-info">
        <h3>${b.name}</h3>
        <p>${b.city}</p>
        <span class="badge-tag">${b.cat}</span>
      </div>
      <span class="badge-check">${earned.has(b.id) ? '✅' : '○'}</span>`;
    div.addEventListener('click', () => collect(b.id));
    grid.appendChild(div);
  });
}

function renderStats() {
  const panel = document.getElementById('statsPanel');
  const count = earned.size;
  const total = BADGES.length;
  const pct = Math.round(count / total * 100);

  const catCounts = {};
  CATS.forEach(c => {
    const all = BADGES.filter(b => b.cat === c);
    catCounts[c] = `${all.filter(b => earned.has(b.id)).length}/${all.length}`;
  });

  panel.innerHTML = `
    <div class="stat-card">
      <h3>Total Badges</h3>
      <div class="stat-number">${count}</div>
      <div class="stat-sub">${pct}% of Korea explored</div>
    </div>
    <div class="stat-card">
      <h3>Cities Visited</h3>
      <div class="stat-number">${CITIES.filter(c => BADGES.some(b => b.city===c && earned.has(b.id))).length}</div>
      <div class="stat-sub">of ${CITIES.length} cities</div>
    </div>
    <div class="stat-card">
      <h3>By Category</h3>
      <div class="category-list">
        ${CATS.map(c => `<div class="category-row"><span>${c}</span><span>${catCounts[c]}</span></div>`).join('')}
      </div>
    </div>`;
}

function buildFilters() {
  const row = document.getElementById('filterRow');
  ['All', ...CITIES, ...CATS].forEach(f => {
    const btn = document.createElement('button');
    btn.className = 'filter-chip' + (f === 'All' ? ' active' : '');
    btn.textContent = f;
    btn.addEventListener('click', () => {
      activeFilter = f;
      row.querySelectorAll('.filter-chip').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderBadges();
    });
    row.appendChild(btn);
  });
}

// --- Tab navigation ---
document.getElementById('bottomNav').addEventListener('click', e => {
  const btn = e.target.closest('.nav-btn');
  if (!btn) return;
  const tab = btn.dataset.tab;
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('tab-' + tab).classList.add('active');
});

// --- GPS check ---
document.getElementById('gpsBtn').addEventListener('click', () => {
  if (!navigator.geolocation) { showToast('⚠️', 'GPS unavailable', 'Location not supported on this browser.'); return; }
  navigator.geolocation.getCurrentPosition(pos => {
    const { latitude, longitude } = pos.coords;
    let found = 0;
    BADGES.forEach(b => {
      if (!earned.has(b.id) && distKm(latitude, longitude, b.lat, b.lng) < 0.5) {
        collect(b.id);
        found++;
      }
    });
    if (!found) showToast('📍', 'No badge nearby', 'Tap any badge to collect in demo mode.');
  }, () => showToast('⚠️', 'Location denied', 'Allow location access in Safari > Settings.'));
});

// --- Share ---
document.getElementById('shareBtn').addEventListener('click', async () => {
  const text = `🇰🇷 Korea Passport: I collected ${earned.size}/${BADGES.length} badges! Can you complete Korea?`;
  try {
    if (navigator.share) { await navigator.share({ title: 'Korea Passport', text }); }
    else { await navigator.clipboard.writeText(text); showToast('📋', 'Copied!', 'Share text copied to clipboard.'); }
  } catch {}
});

// --- Service Worker ---
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

// --- Init ---
buildFilters();
renderAll();

</script>
</body>
</html>
