<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Korea Stamp Passport – Preview</title>
  <style>
body{margin:0;background:#050510;display:flex;justify-content:center;align-items:flex-start;min-height:100vh;padding:28px 0 60px;font-family:sans-serif}
.shell{width:390px;height:844px;border-radius:50px;overflow:hidden;box-shadow:0 0 0 2px #2a2a3a,0 0 0 10px #111,0 50px 100px rgba(0,0,0,.9);flex-shrink:0;position:relative}
.label{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);color:#334155;font-size:12px;letter-spacing:.06em}
/* ── Reset ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0d0d1a;
  --cover-bg: #0a1628;
  --page-bg: #f5f0e8;
  --surface: #1a1a2e;
  --surface2: #16213e;
  --border: rgba(255,255,255,.1);
  --gold: #c9a84c;
  --gold-light: #e8c96a;
  --text: #f1f5f9;
  --muted: #8896a5;
  --accent: #1e5fa8;
  --red-stamp: #8b1a1a;
  --blue-stamp: #0a2d6e;
  --green-stamp: #0d4a2d;
  --purple-stamp: #3d1a6e;
  --teal-stamp: #0a4a4a;
  --nav-h: 72px;
}

html, body { height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Noto Sans KR", sans-serif; -webkit-font-smoothing: antialiased; }
#app { height: 100%; display: flex; flex-direction: column; max-width: 480px; margin: 0 auto; position: relative; overflow: hidden; }
.safe-top { height: env(safe-area-inset-top, 20px); min-height: 20px; background: var(--cover-bg); }
.tab-content { display: none; flex: 1; overflow: hidden; flex-direction: column; }
.tab-content.active { display: flex; }
.scroll-area { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: calc(var(--nav-h) + 12px); }

/* ── Passport Cover ── */
.passport-cover {
  background: linear-gradient(170deg, #0a1628 0%, #0f2347 50%, #0a1628 100%);
  border-bottom: 3px solid var(--gold);
  padding: 22px 24px 20px;
  text-align: center;
  position: relative;
  flex-shrink: 0;
}
.passport-cover::before {
  content: '';
  position: absolute; inset: 8px; border: 1px solid rgba(201,168,76,.3); border-radius: 4px; pointer-events: none;
}
.cover-emblem { font-size: 32px; margin-bottom: 4px; }
.cover-country { font-size: 10px; letter-spacing: .25em; color: var(--gold); margin-bottom: 2px; }
.cover-title { font-size: 22px; font-weight: 800; color: var(--gold-light); letter-spacing: .12em; margin-bottom: 1px; }
.cover-sub { font-size: 13px; color: rgba(201,168,76,.7); letter-spacing: .08em; margin-bottom: 14px; }
.cover-progress { display: flex; align-items: baseline; justify-content: center; gap: 4px; }
.cover-progress #coverCount { font-size: 32px; font-weight: 900; color: var(--gold-light); line-height: 1; }
.cover-slash { font-size: 20px; color: var(--gold); }
.cover-progress #coverTotal { font-size: 20px; color: var(--gold); }
.cover-label { font-size: 12px; color: rgba(201,168,76,.6); margin-left: 6px; }

/* ── Stamp Pages Header ── */
.stamp-pages-header {
  background: var(--surface); border-bottom: 1px solid var(--border);
  padding: 10px 16px; display: flex; flex-direction: column; gap: 8px; flex-shrink: 0;
}
.stamp-pages-header > span:first-child { font-size: 13px; color: var(--muted); font-weight: 600; }
.region-tabs { display: flex; gap: 6px; overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 2px; }
.region-tabs::-webkit-scrollbar { display: none; }
.rtab { background: var(--surface2); border: 1px solid var(--border); color: var(--muted);
  border-radius: 100px; padding: 4px 12px; font-size: 12px; font-weight: 600;
  cursor: pointer; white-space: nowrap; -webkit-tap-highlight-color: transparent; flex-shrink: 0; }
.rtab.active { background: var(--gold); border-color: var(--gold); color: #0a1628; }

/* ── Stamp Grid ── */
.stamp-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; padding: 16px; }

/* ── Individual Stamp ── */
.stamp-wrap { display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.stamp-circle {
  width: 96px; height: 96px; border-radius: 50%; position: relative;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
/* Not-collected: ghost outline */
.stamp-circle.ghost {
  border: 2px dashed rgba(255,255,255,.15);
  background: rgba(255,255,255,.03);
  opacity: .45;
}
/* Collected: ink stamp appearance */
.stamp-circle.inked {
  opacity: 1;
  box-shadow: 0 0 0 2px currentColor, inset 0 0 12px rgba(0,0,0,.35);
}
.stamp-circle.inked::after {
  content: ''; position: absolute; inset: 0; border-radius: 50%;
  background: radial-gradient(circle at 40% 35%, rgba(255,255,255,.12), transparent 60%);
  pointer-events: none;
}
/* Color variants */
.stamp-red   { color: var(--red-stamp);    border: 3px solid var(--red-stamp);    background: rgba(139,26,26,.18); }
.stamp-blue  { color: var(--blue-stamp);   border: 3px solid var(--blue-stamp);   background: rgba(10,45,110,.18); }
.stamp-green { color: var(--green-stamp);  border: 3px solid var(--green-stamp);  background: rgba(13,74,45,.18); }
.stamp-purple{ color: var(--purple-stamp); border: 3px solid var(--purple-stamp); background: rgba(61,26,110,.18); }
.stamp-teal  { color: var(--teal-stamp);   border: 3px solid var(--teal-stamp);   background: rgba(10,74,74,.18); }

/* SVG stamp inner content */
.stamp-svg { width: 96px; height: 96px; position: absolute; inset: 0; }

.stamp-name {
  font-size: 10px; font-weight: 700; color: var(--muted); text-align: center;
  line-height: 1.3; max-width: 90px;
}
.stamp-wrap.earned .stamp-name { color: var(--text); }

/* ── Passport Actions ── */
.passport-actions {
  display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
  padding: 10px 16px; background: var(--surface); border-top: 1px solid var(--border); flex-shrink: 0;
}
.btn-gps { background: var(--accent); color: #fff; border: none; border-radius: 14px; padding: 13px; font-size: 14px; font-weight: 700; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.btn-gps:active { opacity: .8; }
.btn-share { background: var(--surface2); color: var(--text); border: 1px solid var(--border); border-radius: 14px; padding: 13px; font-size: 14px; font-weight: 600; cursor: pointer; -webkit-tap-highlight-color: transparent; }

/* ── Location List Tab ── */
.section-title { font-size: 20px; font-weight: 800; padding: 16px 18px 8px; }
.search-row { padding: 0 16px 12px; }
.search-input { width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 10px 14px; font-size: 14px; color: var(--text); outline: none; }
.search-input::placeholder { color: var(--muted); }
.location-list { display: grid; gap: 0; }
.loc-item {
  display: flex; align-items: center; gap: 14px; padding: 13px 18px;
  border-bottom: 1px solid var(--border); cursor: pointer; -webkit-tap-highlight-color: transparent;
}
.loc-item:active { background: var(--surface); }
.loc-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.loc-info { flex: 1; }
.loc-info h3 { font-size: 14px; font-weight: 700; margin-bottom: 2px; }
.loc-info p { font-size: 12px; color: var(--muted); }
.loc-tag { font-size: 11px; color: var(--muted); background: var(--surface); border: 1px solid var(--border); border-radius: 100px; padding: 2px 8px; flex-shrink: 0; }
.loc-check { font-size: 18px; flex-shrink: 0; }

/* ── Partnership Tab ── */
.partner-cards { display: grid; gap: 14px; padding: 8px 16px 16px; }
.partner-card { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; overflow: hidden; }
.partner-card-header { padding: 16px 18px 10px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--border); }
.partner-icon { font-size: 28px; }
.partner-card-header h3 { font-size: 15px; font-weight: 800; }
.partner-card-header p { font-size: 12px; color: var(--muted); margin-top: 2px; }
.partner-body { padding: 14px 18px; }
.partner-body ul { list-style: none; display: grid; gap: 8px; }
.partner-body li { font-size: 13px; color: var(--muted); padding-left: 16px; position: relative; line-height: 1.45; }
.partner-body li::before { content: '→'; position: absolute; left: 0; color: var(--gold); font-weight: 700; }
.partner-badge { display: inline-block; background: rgba(201,168,76,.15); border: 1px solid rgba(201,168,76,.3); color: var(--gold); font-size: 11px; border-radius: 100px; padding: 3px 10px; margin-top: 10px; }

/* ── Bottom Nav ── */
#bottomNav {
  position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
  width: min(480px, 100%); display: grid; grid-template-columns: repeat(3, 1fr);
  background: rgba(13,13,26,.94); backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  border-top: 1px solid rgba(201,168,76,.2);
  padding-bottom: env(safe-area-inset-bottom, 0); z-index: 100;
}
.nav-btn { background: transparent; border: none; color: var(--muted); padding: 10px 6px;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  cursor: pointer; -webkit-tap-highlight-color: transparent; transition: color .15s; }
.nav-btn span:first-child { font-size: 20px; }
.nav-btn span:last-child { font-size: 10px; font-weight: 700; letter-spacing: .03em; }
.nav-btn.active { color: var(--gold); }

/* ── Toast ── */
.toast {
  position: fixed; top: max(env(safe-area-inset-top,20px),20px); left: 50%;
  transform: translateX(-50%); width: min(340px, calc(100% - 32px));
  background: rgba(10,22,40,.97); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border: 1px solid rgba(201,168,76,.5); border-radius: 16px;
  padding: 14px 18px; display: flex; align-items: center; gap: 14px;
  box-shadow: 0 12px 40px rgba(0,0,0,.6); z-index: 200;
  transition: opacity .3s, transform .3s;
}
.toast.hidden { opacity: 0; pointer-events: none; transform: translateX(-50%) translateY(-14px); }
.toast-stamp-mini { width: 44px; height: 44px; flex-shrink: 0; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 22px; border: 2px solid var(--gold); }
.toast strong { font-size: 14px; display: block; color: var(--gold-light); }
.toast p { font-size: 12px; color: var(--muted); margin-top: 2px; }

  </style>
</head>

</div>

const REGIONS = ['전체', ...new Set(STAMPS.map(s => s.region))];
const COLOR_MAP = {
  red: '#8b1a1a', blue: '#0a2d6e', green: '#0d4a2d', purple: '#3d1a6e', teal: '#0a4a4a'
};

/* ── State ── */
const earned = new Set(JSON.parse(localStorage.getItem('kp_earned') || '[]'));
let activeRegion = '전체';
let searchQuery = '';

function save() { localStorage.setItem('kp_earned', JSON.stringify([...earned])); }

function collect(id) {
  if (earned.has(id)) return;
  earned.add(id); save();
  const s = STAMPS.find(x => x.id === id);
  showToast(s);
  renderAll();
}

/* ── SVG Official Seal Stamp ── */
function makeStampSVG(s, size = 96) {
  const c = COLOR_MAP[s.color];
  const isEarned = earned.has(s.id);
  const opacity = isEarned ? 1 : 0.3;
  const today = isEarned
    ? (JSON.parse(localStorage.getItem('kp_dates') || '{}')?.[s.id] || new Date().toISOString().slice(0,10))
    : '';

  // Arc text helper (city name around the top)
  const r = 38;
  const arcText = s.city.length <= 3 ? s.city : s.city.slice(0,3);

  return `<svg width="${size}" height="${size}" viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg" style="opacity:${opacity}">
  <defs>
    <path id="arc-top-${s.id}" d="M 10,48 a 38,38 0 1,1 76,0"/>
    <path id="arc-bot-${s.id}" d="M 14,54 a 34,34 0 0,0 68,0"/>
  </defs>
  <!-- outer ring -->
  <circle cx="48" cy="48" r="45" fill="none" stroke="${c}" stroke-width="2.5"/>
  <!-- inner ring -->
  <circle cx="48" cy="48" r="38" fill="none" stroke="${c}" stroke-width="1"/>
  <!-- center emoji -->
  <text x="48" y="55" text-anchor="middle" font-size="22">${s.emoji}</text>
  <!-- top arc: city name KO -->
  <text font-size="9" font-weight="700" fill="${c}" font-family="Noto Sans KR, sans-serif" letter-spacing="2">
    <textPath href="#arc-top-${s.id}" startOffset="20%">${s.city}</textPath>
  </text>
  <!-- bottom arc: English -->
  <text font-size="7" fill="${c}" font-family="Arial, sans-serif" letter-spacing="1">
    <textPath href="#arc-bot-${s.id}" startOffset="18%">${s.name_en.toUpperCase()}</textPath>
  </text>
  ${isEarned ? `<!-- date -->
  <text x="48" y="79" text-anchor="middle" font-size="7.5" fill="${c}" font-family="monospace" letter-spacing=".5">${today}</text>` : ''}
  ${isEarned ? `<!-- ink bleed circles -->
  <circle cx="48" cy="48" r="44" fill="none" stroke="${c}" stroke-width=".5" opacity=".3"/>` : ''}
</svg>`;
}

/* ── Toast ── */
let toastTimer;
function showToast(s) {
  const el = document.getElementById('toast');
  document.getElementById('toastStamp').innerHTML = makeStampSVG(s, 44);
  document.getElementById('toastStamp').style.cssText = '';
  document.getElementById('toastTitle').textContent = s.name + ' 스탬프 획득!';
  document.getElementById('toastSub').textContent = `${s.city} · ${s.org}`;
  el.classList.remove('hidden');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.add('hidden'), 3500);
}

/* ── GPS ── */
function distKm(a, b, c, d) {
  const R = 6371, r = Math.PI / 180;
  const dLat = (c-a)*r, dLng = (d-b)*r;
  const x = Math.sin(dLat/2)**2 + Math.cos(a*r)*Math.cos(c*r)*Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(x), Math.sqrt(1-x));
}

/* ── Render ── */
function renderAll() {
  renderCover();
  renderStampGrid();
  renderLocationList();
}

function renderCover() {
  document.getElementById('coverCount').textContent = earned.size;
  document.getElementById('coverTotal').textContent = STAMPS.length;
}

function renderStampGrid() {
  const grid = document.getElementById('stampGrid');
  const visible = activeRegion === '전체' ? STAMPS : STAMPS.filter(s => s.region === activeRegion);
  grid.innerHTML = '';
  visible.forEach(s => {
    const wrap = document.createElement('div');
    wrap.className = 'stamp-wrap' + (earned.has(s.id) ? ' earned' : '');
    const circle = document.createElement('div');
    circle.className = `stamp-circle stamp-${s.color} ${earned.has(s.id) ? 'inked' : 'ghost'}`;
    circle.innerHTML = makeStampSVG(s);
    const label = document.createElement('div');
    label.className = 'stamp-name';
    label.textContent = s.name;
    wrap.appendChild(circle);
    wrap.appendChild(label);
    wrap.addEventListener('click', () => {
      // save date on first collect
      if (!earned.has(s.id)) {
        const dates = JSON.parse(localStorage.getItem('kp_dates') || '{}');
        dates[s.id] = new Date().toISOString().slice(0,10);
        localStorage.setItem('kp_dates', JSON.stringify(dates));
      }
      collect(s.id);
    });
    grid.appendChild(wrap);
  });
}

function renderLocationList() {
  const list = document.getElementById('locationList');
  const q = searchQuery.toLowerCase();
  const visible = STAMPS.filter(s =>
    !q || s.name.includes(q) || s.name_en.toLowerCase().includes(q) || s.city.includes(q) || s.org.includes(q)
  );
  list.innerHTML = '';
  visible.forEach(s => {
    const row = document.createElement('div');
    row.className = 'loc-item';
    row.innerHTML = `
      <div class="loc-dot" style="background:${COLOR_MAP[s.color]}"></div>
      <div class="loc-info">
        <h3>${s.name}</h3>
        <p>${s.city} · ${s.org}</p>
      </div>
      <span class="loc-tag">${s.cat}</span>
      <span class="loc-check">${earned.has(s.id) ? '✅' : '○'}</span>`;
    row.addEventListener('click', () => collect(s.id));
    list.appendChild(row);
  });
}

function renderRegionTabs() {
  const row = document.getElementById('regionFilter');
  row.innerHTML = '';
  REGIONS.forEach(r => {
    const btn = document.createElement('button');
    btn.className = 'rtab' + (r === activeRegion ? ' active' : '');
    btn.textContent = r;
    btn.addEventListener('click', () => {
      activeRegion = r;
      row.querySelectorAll('.rtab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderStampGrid();
    });
    row.appendChild(btn);
  });
}

/* ── Tab Nav ── */
document.getElementById('bottomNav').addEventListener('click', e => {
  const btn = e.target.closest('.nav-btn');
  if (!btn) return;
  const tab = btn.dataset.tab;
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('tab-' + tab).classList.add('active');
});

/* ── GPS Button ── */
document.getElementById('gpsBtn').addEventListener('click', () => {
  if (!navigator.geolocation) { showToastMsg('⚠️', 'GPS 미지원', '이 브라우저에서는 위치 서비스를 사용할 수 없습니다.'); return; }
  navigator.geolocation.getCurrentPosition(pos => {
    const { latitude, longitude } = pos.coords;
    let found = 0;
    STAMPS.forEach(s => {
      if (!earned.has(s.id) && distKm(latitude, longitude, s.lat, s.lng) < 0.3) {
        const dates = JSON.parse(localStorage.getItem('kp_dates') || '{}');
        dates[s.id] = new Date().toISOString().slice(0,10);
        localStorage.setItem('kp_dates', JSON.stringify(dates));
        collect(s.id); found++;
      }
    });
    if (!found) showToastMsg('📍', '근처 스탬프 없음', '장소를 직접 탭해 데모 수집이 가능합니다.');
  }, () => showToastMsg('⚠️', '위치 거부됨', 'Safari 설정 > 개인정보 > 위치 서비스를 허용하세요.'));
});

function showToastMsg(emoji, title, sub) {
  const el = document.getElementById('toast');
  document.getElementById('toastStamp').textContent = emoji;
  document.getElementById('toastStamp').style.fontSize = '28px';
  document.getElementById('toastTitle').textContent = title;
  document.getElementById('toastSub').textContent = sub;
  el.classList.remove('hidden');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.add('hidden'), 3000);
}

  try {
    if (navigator.share) { await navigator.share({ title: 'Korea Stamp Passport', text }); }
    else { await navigator.clipboard.writeText(text); showToastMsg('📋', '복사 완료', '공유 텍스트가 복사되었습니다.'); }

});
